services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agro-price-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/models:/app/models
      - ./apps/api/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=http://localhost:5173

  web:
    image: node:22-alpine
    container_name: agro-price-web
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api